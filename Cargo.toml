[package]
name = "rexile"
version = "0.7.1"
edition = "2021"
authors = ["Ton That Vu <ttvuhm@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "A blazing-fast regex engine with 22x faster compilation and optimized case-insensitive matching"
repository = "https://github.com/KSD-CO/rexile"
documentation = "https://docs.rs/rexile"
homepage = "https://github.com/KSD-CO/rexile"
keywords = ["regex", "pattern", "matching", "parser", "lexer"]
categories = ["text-processing", "parsing", "algorithms"]
readme = "README.md"
rust-version = "1.70"

[lib]
name = "rexile"
path = "src/lib.rs"

[dependencies]
# Core building blocks - NO regex crate!
memchr = "2.7"
aho-corasick = "1.1"

[dev-dependencies]
criterion = "0.5"
regex = "=1.13.1"  # Differential tests and benchmark baseline only

[[bench]]
name = "rexile_benchmark"
harness = false

[[bench]]
name = "pattern_set"
harness = false

[[bench]]
name = "pattern_literals"
harness = false

[workspace]
